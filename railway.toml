[build]
builder = "NIXPACKS"

[deploy]
# Run schema migrations before serving traffic.
# Requires DATABASE_URL from a Railway PostgreSQL service.
startCommand = "/bin/sh -c 'alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
