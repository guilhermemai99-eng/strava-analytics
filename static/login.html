<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Strava Analytics</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #0b0b0b;

            color: #f5f5f5;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .container {

            max-width: 1180px;

            margin: auto;

            padding:
                55px 28px 80px;

        }


        .header {

            margin-bottom: 42px;

        }


        .eyebrow {

            color: #777;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 10px;

        }


        h1 {

            margin: 0;

            font-size: 42px;

            line-height: 1.05;

            font-weight: 650;

            letter-spacing: -1.5px;

        }


        .subtitle {

            margin-top: 12px;

            color: #777;

            font-size: 15px;

        }


        .login-actions {

            margin-top: 28px;

        }


        .login-button {

            display: inline-block;

            background: #f5f5f5;

            color: #0b0b0b;

            border: none;

            border-radius: 10px;

            padding: 12px 18px;

            font-size: 14px;

            font-weight: 650;

            letter-spacing: -0.2px;

            text-decoration: none;

        }


        @media (max-width: 550px) {

            .container {

                padding:
                    35px 18px 60px;

            }


            h1 {

                font-size: 34px;

            }

        }

    </style>

</head>


<body>


<div class="container">

    <header class="header">

        <div class="eyebrow">
            Running Analytics
        </div>

        <h1>
            Strava Analytics
        </h1>

        <div class="subtitle">
            Entra com a tua conta Strava para ver o teu dashboard.
        </div>

        <div class="login-actions">

            <a
                class="login-button"
                href="/auth/strava"
            >
                Entrar com Strava
            </a>

        </div>

    </header>

</div>


</body>

</html>
