<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3ee;
            --black: #000;
            --muted: #6e6c68;
            --lime: #d6ff2e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--black);
            font-family: Inter, sans-serif;
        }
        .shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }
        .card {
            width: min(440px, 100%);
            border: 1px solid var(--black);
            padding: 40px 28px;
            background: var(--bg);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: Archivo, sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.44px;
            margin-bottom: 28px;
        }
        .star {
            width: 10px;
            height: 10px;
            background: var(--lime);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0 50%, 35% 35%);
            border: 1px solid var(--black);
        }
        h1 {
            margin: 0;
            font-family: Archivo, sans-serif;
            font-weight: 800;
            font-size: clamp(32px, 7vw, 44px);
            line-height: 0.95;
            letter-spacing: -1px;
        }
        .subtitle {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
            max-width: 34ch;
        }
        .login-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 32px;
            min-height: 48px;
            padding: 0 22px;
            background: var(--lime);
            color: var(--black);
            border: 1px solid var(--black);
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.26px;
        }
    </style>
</head>
<body>
<div class="shell">
    <section class="card">
        <div class="brand"><span class="star"></span>PULSE</div>
        <h1>RUN TOGETHER.<br>GET BETTER.</h1>
        <p class="subtitle">
            Uma rede social para quem corre. Vê corridas, encontra pessoas, junta-te a um grupo.
        </p>
        <a class="login-button" href="/auth/strava">ENTRAR COM STRAVA</a>
    </section>
</div>
</body>
</html>
