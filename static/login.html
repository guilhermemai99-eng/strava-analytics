<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Strava Analytics</title>


    <style>

        :root {
            --bg: #070707;
            --surface: #111111;
            --line: rgba(255, 255, 255, 0.06);
            --text: #f3f1ec;
            --muted: #8a8680;
            --accent: #d7b56d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(215, 181, 109, 0.08), transparent 50%),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                "Segoe UI",
                sans-serif;
        }

        .shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .card {
            width: min(520px, 100%);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 40px 36px 36px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        .eyebrow {
            color: var(--accent);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(36px, 7vw, 52px);
            line-height: 0.95;
            font-weight: 620;
            letter-spacing: -1.8px;
        }

        .subtitle {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
            max-width: 36ch;
        }

        .login-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 32px;
            min-height: 48px;
            padding: 0 22px;
            background: var(--text);
            color: #0b0b0b;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 390px) {
            .card {
                padding: 28px 22px;
            }
        }

    </style>

</head>


<body>

<div class="shell">

    <section class="card">

        <div class="eyebrow">
            Performance platform
        </div>

        <h1>
            O teu treino,<br>
            com clareza.
        </h1>

        <p class="subtitle">
            Entra com a tua conta Strava para ver score, performance e o plano da semana.
        </p>

        <a
            class="login-button"
            href="/auth/strava"
        >
            Entrar com Strava
        </a>

    </section>

</div>

</body>

</html>
