<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Mono:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/pulse/login.css">
</head>
<body>
<main class="login">
    <section class="login-media">
        <img src="/static/pulse/photos/login-hero.jpg" alt="Grupo de corredores num trilho costeiro">
        <div class="login-sticker" aria-hidden="true"><span class="star"></span>PULSE</div>
    </section>
    <section class="login-panel">
        <div class="login-inner">
            <div class="brand"><span class="star"></span>PULSE</div>
            <p class="eyebrow">A social network for runners</p>
            <h1>RUN TOGETHER.<br>GET BETTER.</h1>
            <p class="body-copy">
                Uma rede social para quem corre. Vê corridas, encontra pessoas, junta-te a um grupo.
            </p>
            <div class="chips">
                <span class="chip accent">FEED</span>
                <span class="chip">RUNS</span>
                <span class="chip soft">DISCOVER</span>
                <span class="chip">PROFILE</span>
            </div>
            <a class="btn full" href="/auth/strava">ENTRAR COM STRAVA</a>
            <p class="fine">Continua com a tua conta Strava.</p>
        </div>
    </section>
</main>
</body>
</html>
