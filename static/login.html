<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse — Entra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060807;
            --text: #f2efe8;
            --muted: #8d968f;
            --accent: #b8f25a;
            --accent-2: #5cffb0;
            --font-display: "Syne", ui-sans-serif, system-ui, sans-serif;
            --font-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            color: var(--text);
            font-family: var(--font-body);
            background: #060807;
            overflow-x: hidden;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            align-items: end;
            padding: clamp(28px, 5vw, 64px);
            isolation: isolate;
        }

        .hero-media {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                linear-gradient(180deg, rgba(6,8,7,0.15) 0%, rgba(6,8,7,0.35) 45%, rgba(6,8,7,0.92) 78%, #060807 100%),
                radial-gradient(1200px 700px at 70% 10%, rgba(184,242,90,0.22), transparent 55%),
                radial-gradient(900px 600px at 10% 80%, rgba(92,255,176,0.14), transparent 50%),
                linear-gradient(135deg, #0b1510 0%, #08110d 40%, #050706 100%);
        }

        .hero-media::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: radial-gradient(ellipse at 60% 30%, black 20%, transparent 75%);
            animation: gridDrift 18s linear infinite;
            opacity: 0.5;
        }

        .hero-media::after {
            content: "";
            position: absolute;
            width: min(52vw, 560px);
            height: min(52vw, 560px);
            right: -8%;
            top: 8%;
            border-radius: 50%;
            border: 1px solid rgba(184,242,90,0.18);
            background:
                radial-gradient(circle at 35% 35%, rgba(184,242,90,0.22), transparent 60%);
            animation: orbFloat 7s ease-in-out infinite alternate;
        }

        @keyframes gridDrift {
            from { transform: translateY(0); }
            to { transform: translateY(72px); }
        }

        @keyframes orbFloat {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(28px) scale(1.05); }
        }

        .hero-content {
            width: min(720px, 100%);
            padding-bottom: clamp(24px, 6vh, 72px);
        }

        .brand {
            font-family: var(--font-display);
            font-size: clamp(56px, 12vw, 120px);
            font-weight: 800;
            letter-spacing: -0.06em;
            line-height: 0.85;
            margin: 0 0 28px;
            opacity: 0;
            transform: translateY(24px);
            animation: rise 0.9s ease forwards;
        }

        .brand span {
            color: var(--accent);
        }

        h1 {
            margin: 0;
            max-width: 12ch;
            font-family: var(--font-display);
            font-size: clamp(28px, 5.4vw, 48px);
            line-height: 1.02;
            letter-spacing: -0.04em;
            font-weight: 700;
            opacity: 0;
            transform: translateY(24px);
            animation: rise 0.9s ease 0.12s forwards;
        }

        .subtitle {
            margin: 18px 0 0;
            max-width: 34ch;
            color: var(--muted);
            font-size: clamp(15px, 2.2vw, 18px);
            line-height: 1.55;
            opacity: 0;
            transform: translateY(24px);
            animation: rise 0.9s ease 0.22s forwards;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 34px;
            min-height: 52px;
            padding: 0 24px;
            border-radius: 999px;
            background: var(--text);
            color: #0b0f0c;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.25s ease, background 0.25s ease;
            opacity: 0;
            transform: translateY(24px);
            animation: rise 0.9s ease 0.34s forwards;
        }

        .cta:hover {
            transform: translateY(-2px);
            background: var(--accent);
        }

        .cta:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 3px;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand, h1, .subtitle, .cta,
            .hero-media::before, .hero-media::after {
                animation: none !important;
                opacity: 1;
                transform: none;
            }
        }

        @media (max-width: 640px) {
            .hero {
                align-items: end;
                padding: 24px 20px 36px;
            }
        }
    </style>
</head>

<body>
    <main class="hero">
        <div class="hero-media" aria-hidden="true"></div>
        <div class="hero-content">
            <p class="brand">Pul<span>se</span></p>
            <h1>O teu treino, com clareza.</h1>
            <p class="subtitle">
                Score, ritmo, carga e o plano da semana — num só lugar, a partir da tua conta Strava.
            </p>
            <a class="cta" href="/auth/strava">Entrar com Strava</a>
        </div>
    </main>
</body>

</html>
