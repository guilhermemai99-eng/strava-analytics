<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse</title>
  <link rel="stylesheet" href="/static/css/pulse.css?v=ig-5">
  <link rel="stylesheet" href="/static/css/pulse-ig.css?v=ig-5">
</head>
<body class="ig-shell">
  <div class="sync-chip" id="syncChip" aria-live="polite">Syncing Strava…</div>

  <div class="pulse-app">
    <aside class="pulse-sidebar ig-sidebar" aria-label="Primary">
      <a class="ig-logo" href="#feed" data-nav="feed" aria-label="Pulse Home">Pulse</a>

      <nav class="ig-nav">
        <button type="button" class="ig-nav-item is-active" data-nav="feed">
          <span class="ig-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
          </span>
          <span class="ig-nav-label">Home</span>
        </button>
        <button type="button" class="ig-nav-item" data-nav="search">
          <span class="ig-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </span>
          <span class="ig-nav-label">Search</span>
        </button>
        <button type="button" class="ig-nav-item" data-nav="explore">
          <span class="ig-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M16.24 7.76L14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76z"/></svg>
          </span>
          <span class="ig-nav-label">Explore</span>
        </button>
        <button type="button" class="ig-nav-item" data-nav="messages">
          <span class="ig-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 3V6z"/></svg>
          </span>
          <span class="ig-nav-label">Messages</span>
          <span class="nav-badge" id="sidebarDmBadge" hidden>0</span>
        </button>
        <button type="button" class="ig-nav-item" data-nav="activity">
          <span class="ig-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.65-7 10-7 10z"/></svg>
          </span>
          <span class="ig-nav-label">Notifications</span>
          <span class="nav-badge" id="sidebarNotifBadge" hidden>0</span>
        </button>
        <button type="button" class="ig-nav-item" data-nav="create">
          <span class="ig-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </span>
          <span class="ig-nav-label">Create</span>
        </button>
        <button type="button" class="ig-nav-item ig-nav-profile" data-nav="profile">
          <span class="ig-nav-avatar" id="navProfileAvatar" aria-hidden="true">P</span>
          <span class="ig-nav-label">Profile</span>
        </button>
      </nav>

      <div class="ig-sidebar-foot">
        <button type="button" class="ig-nav-item" id="openMoreMenu" aria-label="More">
          <span class="ig-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </span>
          <span class="ig-nav-label">More</span>
        </button>
      </div>
    </aside>

    <div class="pulse-stage">
      <header class="ig-mobile-header" id="mobileHeader">
        <div class="ig-mobile-start" id="mobileHeaderStart"></div>
        <h1 class="ig-mobile-title" id="mobileHeaderTitle">Pulse</h1>
        <div class="ig-mobile-end" id="mobileHeaderEnd"></div>
      </header>

      <div class="ig-main-row">
        <main class="pulse-main">
          <div class="pulse-center" id="viewRoot" aria-live="polite"></div>
        </main>
        <aside class="pulse-rail" id="rightRail" aria-label="Suggestions" hidden>
          <div class="pulse-rail-inner" id="rightRailBody"></div>
        </aside>
      </div>
    </div>
  </div>

  <nav class="ig-bottom-nav" aria-label="Mobile">
    <button type="button" data-nav="feed" class="is-active" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
    </button>
    <button type="button" data-nav="search" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button type="button" data-nav="create" aria-label="Create">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" data-nav="activity" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.65-7 10-7 10z"/></svg>
      <span class="nav-badge nav-badge--float" id="bottomNotifBadge" hidden>0</span>
    </button>
    <button type="button" data-nav="profile" class="ig-bottom-profile" aria-label="Profile">
      <span class="ig-bottom-avatar" id="bottomProfileAvatar">P</span>
    </button>
  </nav>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <aside class="more-drawer" id="moreDrawer" aria-hidden="true" aria-label="More">
    <div class="more-drawer-head">
      <h2>More</h2>
      <button type="button" class="icon-btn" id="closeMoreMenu" aria-label="Close">✕</button>
    </div>
    <nav class="more-menu">
      <button type="button" class="more-menu-item" data-nav="coach">
        <span>AI Coach</span>
        <small>Training advice with bite</small>
      </button>
      <a class="more-menu-item" href="/lab">
        <span>Pulse Lab</span>
        <small>Analytics, scores &amp; plans</small>
      </a>
      <button type="button" class="more-menu-item" data-action="open-settings">
        <span>Settings</span>
        <small>Profile, privacy &amp; account</small>
      </button>
      <button type="button" class="more-menu-item" id="syncNowBtnMore">
        <span>Sync Strava</span>
        <small>Pull latest activities</small>
      </button>
      <a class="more-menu-item" href="/auth/logout">
        <span>Log out</span>
      </a>
    </nav>
  </aside>

  <aside class="drawer" id="settingsDrawer" hidden aria-hidden="true" aria-label="Settings">
    <div class="drawer-head">
      <h2>Settings</h2>
      <button type="button" class="icon-btn" id="closeSettings" aria-label="Close">✕</button>
    </div>

    <form class="form-stack" id="profileForm">
      <label>
        Display name
        <input type="text" id="settingsDisplayName" maxlength="120" autocomplete="nickname">
      </label>
      <label>
        Handle
        <input type="text" id="settingsHandle" maxlength="30" autocomplete="username" placeholder="ex: guilherme_run">
      </label>
      <p class="form-hint">3–30 chars: a-z, 0-9, underscore.</p>
      <label>
        Bio
        <textarea id="settingsBio" maxlength="500" placeholder="One line about you as an athlete"></textarea>
      </label>
      <div class="form-row-2">
        <label>
          City
          <input type="text" id="settingsCity" maxlength="80" autocomplete="address-level2">
        </label>
        <label>
          Country
          <input type="text" id="settingsCountry" maxlength="80" autocomplete="country-name">
        </label>
      </div>
      <label class="toggle-row">
        <input type="checkbox" id="settingsPublicExplore">
        <span>
          <strong>Show me in Explore</strong>
          <span class="form-hint" style="margin:4px 0 0;display:block;">Let other runners find you.</span>
        </span>
      </label>
      <div class="profile-actions">
        <button type="button" class="btn btn-ghost" id="settingsAvatarPick">Upload photo</button>
        <button type="button" class="btn btn-ghost" id="settingsAvatarRemove">Remove photo</button>
        <input type="file" id="settingsAvatarFile" accept="image/jpeg,image/png,image/webp" class="sr-only">
      </div>
      <p class="form-hint">JPEG, PNG or WebP · max 8 MB</p>
      <button type="submit" class="btn btn-primary">Save profile</button>
      <p class="form-msg" id="settingsMsg" aria-live="polite"></p>
    </form>

    <div class="drawer-section">
      <h3>Strava</h3>
      <p class="form-hint" id="settingsStravaMeta">Account connected.</p>
      <button type="button" class="btn btn-ghost" id="syncNowBtn" style="margin-top:12px;">Sync Strava now</button>
    </div>

    <div class="drawer-section danger-zone">
      <h3>Danger zone</h3>
      <p class="form-hint">Permanent. No undo.</p>
      <button type="button" class="btn btn-danger" id="deleteAccountBtn" style="margin-top:12px;">Delete Account</button>
    </div>
  </aside>

  <div class="modal-backdrop" id="activityModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="activityModalTitle">
      <div class="drawer-head">
        <h2 id="activityModalTitle">Activity</h2>
        <button type="button" class="icon-btn" id="closeActivityModal" aria-label="Close">✕</button>
      </div>
      <div id="activityModalBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="peopleModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="peopleModalTitle">
      <div class="drawer-head">
        <h2 id="peopleModalTitle">People</h2>
        <button type="button" class="icon-btn" id="closePeopleModal" aria-label="Close">✕</button>
      </div>
      <div id="peopleModalBody" class="people-list"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="confirmModal" hidden>
    <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
      <div class="drawer-head">
        <h2 id="confirmModalTitle">Confirm</h2>
        <button type="button" class="icon-btn" id="closeConfirmModal" aria-label="Close">✕</button>
      </div>
      <p class="confirm-body" id="confirmModalBody"></p>
      <div class="confirm-actions" id="confirmModalActions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/static/js/microcopy.js?v=personality-2"></script>
  <script src="/static/js/pulse.js?v=ig-5" defer></script>
</body>
</html>
