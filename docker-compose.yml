services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: strava
      POSTGRES_PASSWORD: strava
      POSTGRES_DB: strava_analytics
    ports:
      - "5432:5432"
    volumes:
      - strava_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strava -d strava_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  strava_pg_data:
